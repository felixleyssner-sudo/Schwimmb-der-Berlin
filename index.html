<title>Schwimmbäder Berlin</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

/* ── CONFIG ─────────────────────────────────────── */
:root {
  --bg:     #060e1c;
  --bg2:    #0c1728;
  --bg3:    #111f35;
  --card:   #0f1e33;
  --border: rgba(255,255,255,0.07);
  --text:   #dde6f5;
  --text2:  #6b84a8;
  --text3:  #2e4060;
  --green:  #22c55e;
  --red:    #ef4444;
  --yellow: #f59e0b;
  --blue:   #38bdf8;
  --safe-t: env(safe-area-inset-top,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--text); overscroll-behavior:none; }

/* ── LAYOUT ─────────────────────────────────────── */
#app {
  max-width:600px; margin:0 auto; min-height:100vh;
  padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 20px);
  display:flex; flex-direction:column; gap:14px;
}

/* ── HEADER ─────────────────────────────────────── */
.hdr { display:flex; align-items:center; justify-content:space-between; }
.hdr h1 { font-size:20px; font-weight:700; letter-spacing:-.03em; }
.hdr-right { display:flex; align-items:center; gap:10px; }
.loc-btn {
  display:flex; align-items:center; gap:5px;
  background:var(--bg3); border:1px solid var(--border);
  border-radius:20px; padding:6px 12px;
  font-size:11px; color:var(--text2); cursor:pointer;
  font-family:inherit; transition:all .15s;
}
.loc-btn:active { opacity:.7; }
.loc-btn.loading { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.clock-chip {
  font-size:12px; color:var(--text2);
  background:var(--bg3); border:1px solid var(--border);
  border-radius:20px; padding:6px 10px;
}

/* ── WEATHER CARD ───────────────────────────────── */
.weather-card {
  border-radius:16px; padding:14px 16px;
  border:1px solid var(--border);
  background:linear-gradient(135deg,#0c2040,#061830);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.w-left { display:flex; align-items:center; gap:10px; }
.w-icon { font-size:32px; line-height:1; }
.w-temp { font-size:22px; font-weight:700; }
.w-desc { font-size:11px; color:var(--text2); margin-top:1px; }
.w-right { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
.rain-chip {
  font-size:11px; font-weight:600; padding:4px 10px;
  border-radius:20px; white-space:nowrap;
}
.rain-chip.safe { background:rgba(34,197,94,.12); color:#4ade80; border:1px solid rgba(34,197,94,.2); }
.rain-chip.warn { background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.2); border-left:3px solid #ef4444; }
.rain-chip.maybe { background:rgba(245,158,11,.12); color:#fcd34d; border:1px solid rgba(245,158,11,.2); }
.w-wind { font-size:11px; color:var(--text2); }
.weather-error { font-size:11px; color:var(--text3); font-style:italic; }

/* ── DAY TABS ───────────────────────────────────── */
.day-tabs {
  display:grid; grid-template-columns:repeat(7,1fr); gap:3px;
  background:var(--bg2); padding:5px; border-radius:14px;
  border:1px solid var(--border);
}
.day-tab {
  display:flex; flex-direction:column; align-items:center;
  padding:7px 2px; border-radius:9px; border:none;
  background:transparent; color:var(--text2);
  font-family:inherit; font-size:10px; font-weight:500;
  cursor:pointer; transition:all .18s; gap:3px; position:relative;
}
.day-tab .da { font-size:10px; }
.day-tab .dc {
  width:15px; height:15px; border-radius:50%;
  background:rgba(255,255,255,.06); display:flex;
  align-items:center; justify-content:center; font-size:9px; color:var(--text3);
}
.day-tab.active { background:#1d4ed8; color:white; }
.day-tab.active .dc { background:rgba(255,255,255,.25); color:white; }
.day-tab.today .da { color:var(--yellow); }
.day-tab.today.active .da { color:white; }
.day-tab.today::after {
  content:''; position:absolute; bottom:3px;
  width:4px; height:4px; border-radius:50%; background:var(--yellow);
}
.day-tab.today.active::after { background:white; }

/* ── SUMMARY BAR ────────────────────────────────── */
.sum-bar { display:flex; align-items:center; justify-content:space-between; }
.sum-label { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text3); }
.open-pill {
  font-size:11px; font-weight:600; padding:3px 10px;
  border-radius:20px;
}
.open-pill.y { background:rgba(34,197,94,.1); color:#4ade80; border:1px solid rgba(34,197,94,.2); }
.open-pill.n { background:rgba(239,68,68,.08); color:#f87171; border:1px solid rgba(239,68,68,.15); }

/* ── POOL CARDS ─────────────────────────────────── */
.pool-list { display:flex; flex-direction:column; gap:8px; }

.pcard {
  border-radius:14px; padding:14px 16px;
  border:1px solid var(--border); background:var(--card);
  transition:all .15s; position:relative; overflow:hidden;
}
.pcard.open { border-color:rgba(255,255,255,.1); background:var(--bg3); }
.pcard.closed { opacity:.35; }
.pcard.open-now::before {
  content:''; position:absolute; left:0; top:0; bottom:0;
  width:3px; background:var(--green); border-radius:14px 0 0 14px;
}

.pcard-top { display:flex; align-items:center; gap:12px; }
.pbadge {
  width:38px; height:38px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700;
}
.pinfo { flex:1; min-width:0; }
.pname { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pmeta { font-size:11px; color:var(--text2); margin-top:2px; display:flex; align-items:center; gap:8px; }
.pdist { color:var(--blue); font-weight:500; }

.phours { text-align:right; flex-shrink:0; }

/* ═══════════════════════════════════════════════════
   HILFSFUNKTIONEN
   ═══════════════════════════════════════════════════ */
const DK = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const DF = {Mo:"Montag",Di:"Dienstag",Mi:"Mittwoch",Do:"Donnerstag",Fr:"Freitag",Sa:"Samstag",So:"Sonntag"};

function haversine(la1,lo1,la2,lo2) {
  const R=6371,d2r=Math.PI/180;
  const dLa=(la2-la1)*d2r, dLo=(lo2-lo1)*d2r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*d2r)*Math.cos(la2*d2r)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function toMin(t) {
  const [h,m]=(t||"0:0").split(":").map(Number);
  return h*60+(m||0);
}

function isOpenNow(pool, day) {
  const slots=pool.hours[day]||[];
  if(!slots.length) return false;
  const now=new Date(), cur=now.getHours()*60+now.getMinutes();
  return slots.some(s=>cur>=toMin(s.s)&&cur<toMin(s.e));
}

function hoursDisplay(pool, day) {
  const slots=pool.hours[day]||[];
  if(!slots.length) return null;
  return slots.map(s=>`${s.s}–${s.e}`).join(" / ");
}

function waterTemp(pool) {
  if(pool.type==="indoor") return "28°C";
  const m=new Date().getMonth();
  const temps=[null,null,null,17,20,22,25,26,23,20,null,null];
  const t=temps[m];
  return t?`${t}°C`:null;
}

// Fülle-Schätzung basierend auf typischen Berliner Bäder-Mustern
// 1=ruhig 🏊‍♀️, 2=mittel 🏊‍♀️🏊‍♀️, 3=voll 🏊‍♀️🏊‍♀️🏊‍♀️
function crowdLevel(dayKey) {
  const now=new Date();
  const h=now.getHours()+(now.getMinutes()/60);
  const isWeekend=(dayKey==="Sa"||dayKey==="So");
  if(isWeekend){
    if(h<10) return 1;
    if(h<11) return 2;
    if(h<17) return 3;
    return 2;
  }
  // Wochentag
  if(h<7.5)  return 1; // Frühschwimmer – ruhig
  if(h<9)    return 2; // Vor der Arbeit
  if(h<12)   return 1; // Vormittag – ruhig
  if(h<14)   return 2; // Mittagspause
  if(h<17)   return 1; // Nachmittag – ruhig
  if(h<20)   return 3; // Feierabend – sehr voll
  return 1;            // Abend – ruhig
}

function crowdHtml(level) {
  const fig="🏊‍♀️";
  const colors=["","#4ade80","#fbbf24","#f87171"];
  const labels=["","Ruhig","Mittel","Voll"];
  const icons=fig.repeat(level)+"<span style='opacity:.2'>"+fig.repeat(3-level)+"</span>";
  return `<div class="crowd-chip" title="Erwartete Fülle: ${labels[level]}">
    <span class="crowd-icons">${icons}</span>
    <span class="crowd-label" style="color:${colors[level]}">${labels[level]}</span>
  </div>`;
}

function fmtDist(d) {
  if(d<1) return Math.round(d*1000)+"m";
  return d.toFixed(1).replace(".",",")+" km";
}

function getLocation() {
  const btn=document.getElementById("locBtn");
  btn.className="loc-btn loading";
  btn.textContent="📍 Suche…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat=pos.coords.latitude;
      userLng=pos.coords.longitude;
      btn.className="loc-btn";
      btn.textContent="📍 Aktuell";
      if(OWM_KEY!=="DEIN_API_KEY_HIER") fetchWeather();
      renderPools();
    },
    () => {
      btn.className="loc-btn";
      btn.textContent="📍 Standort";
      renderPools();
    },
    {timeout:8000, enableHighAccuracy:true}
  );
}

/* ═══════════════════════════════════════════════════
   WETTER
   ═══════════════════════════════════════════════════ */
const WEATHER_ICONS = {
  "01":"☀️","02":"🌤","03":"⛅","04":"☁️",
  "09":"🌧","10":"🌦","11":"⛈","13":"🌨","50":"🌫"
};

async function fetchWeather() {
  if(!userLat||OWM_KEY==="DEIN_API_KEY_HIER") return;
  try {
    const [cur,fc] = await Promise.all([
      fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${userLat}&lon=${userLng}&appid=${OWM_KEY}&units=metric&lang=de`).then(r=>r.json()),
      fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${userLat}&lon=${userLng}&appid=${OWM_KEY}&units=metric&cnt=6&lang=de`).then(r=>r.json())
    ]);
    const rain3h = fc.list.slice(0,3).some(i=>
      (i.weather[0].id>=200&&i.weather[0].id<700)||
      (i.pop&&i.pop>0.4)
    );
    const pop = Math.max(...fc.list.slice(0,3).map(i=>i.pop||0));
    weatherData = {
      temp: Math.round(cur.main.temp),
      feel: Math.round(cur.main.feels_like),
      desc: cur.weather[0].description,
      icon: WEATHER_ICONS[cur.weather[0].icon.slice(0,2)] || "🌡",
      wind: Math.round(cur.wind.speed*3.6),
      rain: rain3h,
      pop: Math.round(pop*100)
    };
    renderWeather();
  } catch(e) {
    document.getElementById("weatherBox").innerHTML=
      `<div class="weather-card"><span class="weather-error">⚠️ Wetter konnte nicht geladen werden</span></div>`;
  }
}

function renderWeather() {
  if(!weatherData) {
    if(OWM_KEY==="DEIN_API_KEY_HIER") {
      document.getElementById("weatherBox").innerHTML=
        `<div class="weather-card"><span class="weather-error">🔑 API-Key eintragen für Wetter & Regenwarnung</span></div>`;
    }
    return;
  }
  const w=weatherData;
  const rainChip = w.rain
    ? `<div class="rain-chip warn">🌧 Regen in 1–3h (${w.pop}%)<br><small>Regenzeug mitnehmen!</small></div>`
    : w.pop>20
      ? `<div class="rain-chip maybe">🌦 Evtl. Regen (${w.pop}%)</div>`
      : `<div class="rain-chip safe">✅ Trocken – gutes Fahrradwetter</div>`;
  document.getElementById("weatherBox").innerHTML=`
    <div class="weather-card">
      <div class="w-left">
        <div class="w-icon">${w.icon}</div>
        <div>
          <div class="w-temp">${w.temp}°C</div>
          <div class="w-desc">${w.desc} · Gefühlt ${w.feel}°C</div>
        </div>
      </div>
      <div class="w-right">
        ${rainChip}
        <div class="w-wind">💨 ${w.wind} km/h</div>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════
   DAY TABS
   ═══════════════════════════════════════════════════ */
function renderTabs() {
  const ord=["Mo","Di","Mi","Do","Fr","Sa","So"];
  document.getElementById("dayTabs").innerHTML=ord.map(d=>`
    <button class="day-tab${d===selDay?" active":""}${d===todayKey?" today":""}" onclick="selDay='${d}';renderTabs();renderPools()">
      <span class="da">${d}</span>
      <span class="dc">${POOLS.filter(p=>(p.hours[d]||[]).length).length}</span>

/* ═══════════════════════════════════════════════════
   POOL-LISTE
   ═══════════════════════════════════════════════════ */
function renderPools() {
  const label=document.getElementById("sumLabel");
  const pill=document.getElementById("openPill");
  label.textContent=DF[selDay]+(selDay===todayKey?" · Heute":"");

  let pools=[...POOLS];

  // Entfernung berechnen
  if(userLat) {
    pools=pools.map(p=>({...p,dist:haversine(userLat,userLng,p.lat,p.lng)}));
    pools.sort((a,b)=>a.dist-b.dist);
  }

  const hasHours=pools.filter(p=>(p.hours[selDay]||[]).length);
  pill.className="open-pill "+(hasHours.length?"y":"n");
  pill.textContent=hasHours.length?hasHours.length+" geöffnet":"Alle geschlossen";

  const isToday=selDay===todayKey;

  document.getElementById("poolList").innerHTML=pools.map(p=>{
    const slots=p.hours[selDay]||[];
    const hasSlots=slots.length>0;
    const openNow=isToday&&isOpenNow(p,selDay);
    const display=hoursDisplay(p,selDay);
    const wt=waterTemp(p);
    const distStr=p.dist!=null?fmtDist(p.dist):null;
    const typeLabel=p.type==="outdoor"?"☀️ Freibad":p.type==="combo"?"🏗 Kombibad":"🏛 Hallenbad";
    const crowd=isToday&&hasSlots?crowdLevel(selDay):null;

    const hoursHtml=display
      ? display.split(" / ").map(t=>`<div class="phours-line" style="color:${p.color}">${t}</div>`).join("")
      : `<span class="pclosed-lbl">Geschlossen</span>`;

    const statusHtml=isToday?`
      <div class="status-chip">
        <div class="status-dot ${openNow?"open":"closed"}"></div>
        <span style="color:${openNow?"#4ade80":"#f87171"}">${openNow?"Jetzt geöffnet":"Jetzt geschlossen"}</span>
      </div>`:
      `<div class="status-chip"><span style="color:var(--text3)">${typeLabel}</span></div>`;

    const tempHtml=wt?`<div class="temp-chip">💧 <span class="temp-val">${wt}</span></div>`:"";
    const poolSpecHtml=`<div class="pool-spec">🏊 ${p.lanes} Bahnen · ${p.length}m</div>`;

    return `<div class="pcard ${hasSlots?"open":"closed"}${openNow?" open-now":""}">
      <div class="pcard-top">
        <div class="pbadge" style="background:${p.color}1a;color:${p.color};border:1px solid ${p.color}33">${p.short}</div>
        <div class="pinfo">
          <div class="pname">${p.name}</div>
          <div class="pmeta">
            ${distStr?`<span class="pdist">${distStr}</span>`:""}
            <span>${p.address}</span>
          </div>
        </div>
        <div class="phours">${hoursHtml}</div>
      </div>
      <div class="pcard-bottom">
        ${statusHtml}
        ${poolSpecHtml}
        ${tempHtml}
      </div>
      ${crowd?`<div class="pcard-crowd">${crowdHtml(crowd)}</div>`:""}
    </div>`;
  }).join("");
}

/* ═══════════════════════════════════════════════════
   UHRZEIT
   ═══════════════════════════════════════════════════ */
function tick() {
  const n=new Date();
  document.getElementById("clk").textContent=
    String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
}

/* ═══════════════════════════════════════════════════
   PWA ICON (Homescreen)
   ═══════════════════════════════════════════════════ */
function setIcon() {
  try {
    const c=document.createElement("canvas");
    c.width=180;c.height=180;
    const ctx=c.getContext("2d");
    // Background gradient
    const g=ctx.createLinearGradient(0,0,180,180);
    g.addColorStop(0,"#071428");g.addColorStop(1,"#0a2a50");
    ctx.fillStyle=g;
    ctx.beginPath();ctx.roundRect(0,0,180,180,38);ctx.fill();
    // Wave
    ctx.fillStyle="rgba(14,165,233,0.3)";
    ctx.beginPath();ctx.moveTo(0,120);ctx.quadraticCurveTo(45,105,90,120);ctx.quadraticCurveTo(135,135,180,120);ctx.lineTo(180,180);ctx.lineTo(0,180);ctx.fill();
    ctx.fillStyle="rgba(56,189,248,0.2)";
    ctx.beginPath();ctx.moveTo(0,132);ctx.quadraticCurveTo(45,120,90,132);ctx.quadraticCurveTo(135,144,180,132);ctx.lineTo(180,180);ctx.lineTo(0,180);ctx.fill();
    // Swimmer emoji
    ctx.font="80px serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("🏊",90,82);
    const lnk=document.createElement("link");
    lnk.rel="apple-touch-icon";lnk.href=c.toDataURL();
    document.head.appendChild(lnk);
  }catch(e){}
}

/* ═══════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════ */

tick();
setInterval(tick,10000);
setInterval(renderPools,60000);
renderWeather();
renderTabs();
renderPools();

// Splash ausblenden
function hideSplash() {
  const s=document.getElementById("splash");
  s.classList.add("hide");
  setTimeout(()=>s.remove(),800);
}

// Automatisch Standort abrufen – Splash weg sobald fertig (oder nach 3s)
const splashTimeout=setTimeout(hideSplash,3000);
if(navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos=>{
      clearTimeout(splashTimeout);
      userLat=pos.coords.latitude;
      userLng=pos.coords.longitude;
      document.getElementById("locBtn").className="loc-btn";
      document.getElementById("locBtn").textContent="📍 Aktuell";
      if(OWM_KEY!=="DEIN_API_KEY_HIER") fetchWeather();
      renderPools();
      hideSplash();
    },
    ()=>{ clearTimeout(splashTimeout); hideSplash(); renderPools(); },
    {timeout:5000,enableHighAccuracy:true}
  );
} else { hideSplash(); }
</script>
